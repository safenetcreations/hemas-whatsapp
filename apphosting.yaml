runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_APP_STAGE
    value: demo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_EXTERNAL_MESSAGING_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_REAL_PATIENT_DATA_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME
